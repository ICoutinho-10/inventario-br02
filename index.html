<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventário BR02</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Oxanium:wght@600;700;800&display=swap">
<style>
  :root {
    --bg: #F4F5FA; --card: #FFFFFF; --ink: #0F172A; --dim: #64748B; --line: #E6E8F0; --line2: #D5D9E5;
    --red: #E11D48; --red2: #BE123C; --grad: linear-gradient(135deg, #F43F5E 0%, #E11D48 45%, #9F1239 100%);
    --green: linear-gradient(135deg, #34D399 0%, #10B981 45%, #047857 100%);
    --indigo: #4F46E5; --ok: #047857; --okbg: #ECFDF5; --warn: #B45309; --warnbg: #FFFBEB; --err: #BE123C; --errbg: #FFF1F2;
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: radial-gradient(900px 600px at 85% -10%, #3B2A8C 0%, transparent 60%), radial-gradient(800px 600px at -10% 110%, #7A1236 0%, transparent 55%), #0B0D2A;
         background-attachment: fixed; color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }

  /* App flutuando sobre o fundo, com cantos arredondados */
  .app { max-width: 560px; margin: 24px auto; height: calc(100vh - 48px); height: calc(100dvh - 48px); display: flex; flex-direction: column;
         background: var(--bg); border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); }

  /* Cabeçalho com degradê */
  .top { background: linear-gradient(135deg, #1E1B4B 0%, #3730A3 55%, #9F1239 130%); color: #fff; flex: 0 0 auto; }
  .topin { padding: 18px 22px; display: flex; align-items: center; gap: 14px; }
  .logo { height: 46px; width: 92px; flex: 0 0 auto; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); padding: 4px 6px; }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tt b { display: block; font-family: "Oxanium", var(--font); font-weight: 800; font-size: 20px; letter-spacing: .3px; line-height: 1.1; }
  .tt small { color: rgba(255,255,255,.72); font-size: 12.5px; font-weight: 600; }
  .wrap { flex: 1; overflow-y: auto; padding: 18px 20px 20px; }

  /* Conferente + Endereço */
  .sess { position: relative; display: flex; gap: 10px; }
  .box { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 6px;
         transition: border-color .15s, box-shadow .15s; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .box:focus-within { border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(79,70,229,.12); }
  .box .k { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--dim); letter-spacing: .6px; text-transform: uppercase; }
  .box .k svg { color: var(--indigo); }
  .box input { height: 34px; padding: 0; border: 0; border-radius: 0; box-shadow: none; font-size: 17px; background: transparent; }
  .box input:focus { box-shadow: none; }
  .box input::placeholder { font-size: 14px; }
  .box .seta { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--dim); pointer-events: none; }
  .box .in { position: relative; }
  .box .in input { padding-right: 22px; }

  .opts { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; max-height: 50vh; overflow-y: auto;
          background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 28px rgba(17,24,39,.16); }
  .opts.on { display: block; }
  .opt { padding: 13px 14px; font-weight: 700; font-size: 16px; cursor: pointer; border-bottom: 1px solid var(--line);
         display: flex; justify-content: space-between; align-items: center; }
  .opt:last-child { border-bottom: 0; }
  .opt:hover, .opt.ativo { background: #EEF2FF; }
  .opt.sel { color: var(--red); }
  .opt.sel::after { content: "✓"; font-weight: 800; }
  .opt mark { background: none; color: var(--red); }
  .opt.novo { color: var(--warn); font-weight: 600; font-size: 14px; }
  .opts .info { padding: 9px 14px; font-size: 12px; color: var(--dim); }

  .card { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; box-shadow: 0 4px 16px rgba(15,23,42,.05); }
  .lab { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 800; color: var(--dim); letter-spacing: .6px; text-transform: uppercase; margin-bottom: 8px; }
  .lab svg { color: var(--indigo); }
  .field { position: relative; }
  input { width: 100%; font-family: var(--font); font-weight: 800; color: var(--ink); background: #F8F9FC; border: 1px solid var(--line2);
          border-radius: 14px; padding: 0 14px; height: 58px; font-size: 21px; text-transform: uppercase; transition: .15s; }
  input::placeholder { color: #A0A8BA; font-weight: 600; text-transform: none; font-size: 16px; }
  input:focus { outline: none; background: #fff; border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(79,70,229,.12); }
  #cod { padding-left: 52px; }
  .scan { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; padding: 7px; border-radius: 10px;
          color: #fff; background: var(--grad); pointer-events: none; }
  #qtd { height: 74px; font-size: 34px; text-align: center; letter-spacing: 1px; }
  .desc { min-height: 20px; margin: 8px 2px 16px; font-size: 13px; font-weight: 700; color: var(--dim); }
  .desc.ok { color: var(--ok); } .desc.warn { color: var(--warn); }
  .sw { margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
        border: 1px dashed var(--line2); background: #F8F9FC; cursor: pointer; user-select: none; transition: .15s; }
  .sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sw .tg { width: 44px; height: 26px; border-radius: 13px; background: #CBD2E0; position: relative; flex: 0 0 auto; transition: .15s; }
  .sw .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
                   box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .15s; }
  .sw .tx b { display: block; font-size: 14px; }
  .sw .tx small { color: var(--dim); font-size: 12px; }
  .sw.on { border: 1px solid #F59E0B; background: #FFFBEB; }
  .sw.on .tg { background: linear-gradient(135deg, #FBBF24, #F59E0B); }
  .sw.on .tg::after { left: 21px; }
  li.seg { box-shadow: inset 3px 0 0 #F59E0B; }
  li .tag2 { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: #FEF3C7; color: #92400E; font-size: 11px; font-weight: 800; }
  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: 14.5px; font-weight: 700; display: none; }
  .msg.ok { display: block; background: var(--okbg); color: var(--ok); }
  .msg.warn { display: block; background: var(--warnbg); color: var(--warn); }
  .msg.err { display: block; background: var(--errbg); color: var(--err); }

  .sect { margin: 22px 2px 10px; font-size: 11.5px; font-weight: 800; color: var(--dim); letter-spacing: .6px; text-transform: uppercase; }
  .sect svg { color: var(--indigo); }
  .sect .n { color: var(--indigo); }
  ul { list-style: none; margin: 0; padding: 0 0 8px; }
  li { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 10px; margin-bottom: 8px; }
  li .q { font-weight: 800; font-size: 16px; color: var(--red2); min-width: 46px; height: 40px; padding: 0 6px; border-radius: 12px; background: #FFF1F2;
          display: grid; place-items: center; text-align: center; }
  li .t { flex: 1; min-width: 0; }
  li .t b { display: block; font-size: 14px; }
  li .t > span { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .h { font-size: 12px; color: var(--ink); font-weight: 800; text-align: right; line-height: 1.35; }
  li .h i { display: block; font-style: normal; font-weight: 600; color: var(--dim); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.anulada { opacity: .5; } li.anulada .q { text-decoration: line-through; }
  li.meu { border-color: #C7D2FE; }
  .sect { display: flex; align-items: center; gap: 8px; }
  .sect .live { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); text-transform: none; letter-spacing: 0; font-weight: 600; }
  .sect .dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; animation: pulso 2s infinite; }
  .sect .dot.off { background: #9CA3AF; animation: none; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.55); } 70% { box-shadow: 0 0 0 8px rgba(22,163,74,0); } 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); } }
  /* Menu lateral (parte escura) */
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; z-index: 6; padding: 22px 14px; color: #EEF1FF;
          background: rgba(10,12,40,.55); border-right: 1px solid rgba(120,130,240,.22); }
  .side .mt { font-family: "Oxanium", var(--font); font-weight: 800; font-size: 12px; letter-spacing: 1.2px; color: #A6B0E8; margin: 0 10px 12px; }
  .side button { width: 100%; height: 46px; margin-bottom: 6px; border: 0; border-radius: 12px; background: transparent; color: #C7CEF5;
                 font-family: var(--font); font-weight: 800; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; }
  .side button:hover { background: rgba(120,130,240,.14); }
  .side button.on { background: var(--green); color: #fff; box-shadow: 0 8px 20px rgba(16,185,129,.35); }
  body { padding-left: 220px; }

  /* Aba KARDEX: visualização real da ficha */
  .kview { display: none; padding: 22px 26px 40px; color: #EEF1FF; }
  body.v-k .app { display: none; }
  body.v-k .kview { display: block; }
  .ktool { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; background: rgba(60,64,150,.28); border: 1px solid rgba(120,130,240,.28);
           border-radius: 16px; padding: 14px 16px; margin-bottom: 18px; }
  .ktool .kf { flex: 1 1 220px; min-width: 200px; }
  .ktool label.kl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #A6B0E8; margin: 0 0 6px; }
  .ktool input.ki { height: 42px; font-size: 16px; background: rgba(10,12,40,.6); color: #EEF1FF; border: 1.5px solid rgba(120,130,240,.35); border-radius: 10px; }
  .ktool input.ki:focus { border-color: #22D3EE; box-shadow: 0 0 0 3px rgba(34,211,238,.18); }
  .kseg { display: flex; background: rgba(10,12,40,.6); border: 1px solid rgba(120,130,240,.35); border-radius: 10px; padding: 3px; gap: 3px; min-width: 230px; }
  .kseg button { flex: 1; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #A6B0E8; font-family: var(--font); font-weight: 800; font-size: 13px; cursor: pointer; padding: 0 12px; }
  .kseg button.on { background: #EEF1FF; color: #111827; }
  .ktool .sw { margin: 0; padding: 7px 12px; background: rgba(10,12,40,.6); border: 1.5px dashed rgba(120,130,240,.35); color: #EEF1FF; }
  .ktool .sw .tx small { color: #A6B0E8; }
  .ktool .sw.on { border: 1.5px solid #F59E0B; background: rgba(245,158,11,.14); }
  .kgo { height: 44px; border: 0; border-radius: 12px; background: var(--green); box-shadow: 0 8px 20px rgba(16,185,129,.35); color: #fff; font-family: var(--font); padding: 0 18px;
         font-weight: 800; font-size: 14px; letter-spacing: .3px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .kgo:hover { filter: brightness(1.06); }
  .kgo:disabled { opacity: .6; cursor: wait; }
  .kmsg { font-size: 13px; color: #C7CEF5; margin: -6px 2px 14px; min-height: 18px; }
  .kmsg.err { color: #FCA5A5; }
  .kprev { overflow-x: auto; }
  .kpg { background: #fff; width: 1123px; min-height: 794px; padding: 38px; box-sizing: border-box; margin: 0 auto 22px; box-shadow: 0 10px 40px rgba(0,0,0,.45); border-radius: 4px; }
  .kvazio { max-width: 520px; margin: 60px auto; text-align: center; color: #A6B0E8; font-size: 15px; line-height: 1.5; }
  @media (max-width: 900px) {
    body { padding-left: 0; }
    .app { margin: 12px; height: calc(100vh - 80px); height: calc(100dvh - 80px); border-radius: 24px; }
    .side { position: sticky; top: 0; bottom: auto; width: auto; display: flex; gap: 6px; padding: 8px 10px; border-right: 0; border-bottom: 1px solid rgba(120,130,240,.22); background: #0f1030; }
    .side .mt { display: none; }
    .side button { margin: 0; height: 40px; justify-content: center; }
  }
  @media (max-width: 480px) {
    .topin { padding: 14px 16px; gap: 12px; }
    .logo { width: 74px; height: 38px; border-radius: 10px; }
    .tt b { font-size: 17px; }
    .tt small .pv { display: none; }
    .wrap { padding: 14px 14px 16px; }
    .sect { flex-wrap: wrap; }
    .sect .live { font-size: 10.5px; }
    .kview { padding: 14px 12px 40px; }
  }

  /* Ficha KARDEX impressa (FO.SC.A.026) */
  .kpg { font-family: Calibri, Carlito, Arial, sans-serif; color: #000; page-break-after: always; }
  .kpg:last-child { page-break-after: auto; }
  .ktit { width: 1039px; text-align: center; font-weight: 700; font-size: 30pt; line-height: 1; margin: 0 0 14px; padding-right: 111px; box-sizing: border-box; }
  .kwrap { display: flex; align-items: flex-start; }
  .kx { border-collapse: collapse; table-layout: fixed; width: 928px; font-size: 9.5pt; }
  .kx td, .kx th { height: 16.5px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .kx .r1 td { height: 46px; font-size: 12pt; font-weight: 700; text-align: center; border: 1px solid #000; white-space: normal; }
  .kx .r1 .klogo img { width: 68px; height: 33px; display: block; margin: 0 auto; }
  .kx .r2 th { height: 21px; font-size: 10pt; font-weight: 700; text-align: center; border: 1px solid #000; }
  .kx .b td { border-left: 1px solid #000; border-right: 1px solid #000; border-bottom: 1px dotted #555; text-align: center; }
  .kx .b td.l { text-align: left; }
  .kx .b td.q { border-left: 1px dotted #555; border-right: 1px dotted #555; }
  .kx .b td.q1 { border-left: 1px solid #000; text-align: left; padding-left: 30px; }
  .kx .b td.q6 { border-right: 1px solid #000; }
  .kx .b.ult td { border-bottom: 1px solid #000; }
  .kfo { width: 111px; height: 46px; border: 1px solid #000; border-left: 0; box-sizing: border-box; display: flex; flex-direction: column;
         align-items: center; justify-content: center; font-size: 9pt; line-height: 1.35; }
  .kfo b { font-size: 9.5pt; }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    html, body { background: #fff !important; padding: 0 !important; }
    .app, .side, .ktool, .kmsg, .bar { display: none !important; }
    .kview { display: block !important; padding: 0 !important; }
    .kprev { overflow: visible; }
    #kardex { zoom: 1 !important; }
    .kpg { width: auto; min-height: 0; padding: 0; margin: 0; box-shadow: none; border-radius: 0; }
  }
  li.vazio { color: var(--dim); font-size: 13px; background: transparent; padding: 4px 2px; }

  .go { margin-top: 16px; width: 100%; height: 58px; border: 0; border-radius: 16px; background: var(--green); color: #fff; font-family: var(--font);
        font-size: 16px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        box-shadow: 0 10px 24px rgba(16,185,129,.35); transition: transform .1s, box-shadow .15s, filter .15s; }
  .go:hover { filter: brightness(1.06); box-shadow: 0 12px 28px rgba(16,185,129,.45); }
  .go:active { transform: translateY(1px); }
  .go:disabled { opacity: .6; cursor: wait; }
</style>
</head>

<script>
  // Ponte GitHub Pages -> planilha (API do Apps Script). Mantém a mesma interface do google.script.run.
  var API = 'https://script.google.com/macros/s/AKfycbxZ_IsIjAAS05Oc4a-V7sD5BJhG0YtYSHgActg3Y2GeCD6pYQG3xNUr7DmJcp_rjhNv/exec';
  (function () {
    function get(acao, p) {
      var q = Object.keys(p || {}).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(p[k] == null ? '' : p[k]); }).join('&');
      return fetch(API + '?api=' + acao + (q ? '&' + q : ''), { redirect: 'follow' });
    }
    function post(corpo) { return fetch(API, { method: 'POST', body: JSON.stringify(corpo), redirect: 'follow' }); }
    var ROTAS = {
      listarEnderecos: function () { return get('base'); },
      buscarProduto: function (codigo, locacao) { return get('buscar', { codigo: codigo, locacao: locacao }); },
      ultimosLancamentos: function (qtd) { return get('ultimos', { qtd: qtd }); },
      salvarContagem: function (d) { var c = { acao: 'salvar' }; for (var k in d) c[k] = d[k]; return post(c); },
      kardex: function (filtro, fonte) { return get('kardex', { filtro: filtro, fonte: fonte }); }
    };
    function runner(ok, falha) {
      var r = {
        withSuccessHandler: function (f) { return runner(f, falha); },
        withFailureHandler: function (f) { return runner(ok, f); }
      };
      Object.keys(ROTAS).forEach(function (nome) {
        r[nome] = function () {
          ROTAS[nome].apply(null, arguments)
            .then(function (resp) { return resp.json(); })
            .then(function (j) { if (j && j.ok) { if (ok) ok(j.dados); } else if (falha) falha(new Error((j && j.erro) || 'Erro na planilha')); })
            .catch(function (e) { if (falha) falha(e); });
        };
      });
      return r;
    }
    window.google = { script: { run: runner(null, null) } };
  })();
</script>

  function gravar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function limpa(v) { return String(v || '').trim().toUpperCase().replace(/\s+/g, ' '); }
  estado.resp = ler('inv_resp');
  estado.loc = ler('inv_loc');
  $('resp').value = estado.resp;
  $('loc').value = estado.loc;
  $('seg').checked = ler('inv_seg') === '1';
  function pintarSeg() { $('sw').classList.toggle('on', $('seg').checked); $('btnTx').textContent = $('seg').checked ? 'Lançar 2ª contagem' : 'Lançar contagem'; }
  $('seg').addEventListener('change', function () { gravar('inv_seg', this.checked ? '1' : ''); pintarSeg(); $('cod').focus(); });

  // ---- conferente: campo direto ----
  function salvarResp() { estado.resp = limpa($('resp').value); $('resp').value = estado.resp; gravar('inv_resp', estado.resp); }
  $('resp').addEventListener('change', salvarResp);
  $('resp').addEventListener('blur', salvarResp);
  $('resp').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); salvarResp(); (estado.loc ? $('cod') : $('loc')).focus(); }
  });

  // ---- endereço: caixa de seleção com pesquisa ----
  function semAcento(s) { return String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
  var END_IDX = ENDERECOS.map(function (e) { return { v: e, k: semAcento(e) }; });
  var filtrados = [], ativo = 0, LIM = 100;

  function abrirLista() { ativo = 0; listar(); $('opts').classList.add('on'); $('loc').setAttribute('aria-expanded', 'true'); }
  function fecharLista() { $('opts').classList.remove('on'); $('loc').setAttribute('aria-expanded', 'false'); }

  function listar() {
    var digitado = $('loc').value;
    var termo = semAcento(digitado === estado.loc ? '' : digitado);
    var box = $('opts');
    box.innerHTML = '';
    if (!termo) filtrados = END_IDX.slice();
    else {
      var comeca = [], contem = [];
      END_IDX.forEach(function (o) { var i = o.k.indexOf(termo); if (i === 0) comeca.push(o); else if (i > 0) contem.push(o); });
      filtrados = comeca.concat(contem);
    }
    var frag = document.createDocumentFragment();
    filtrados.slice(0, LIM).forEach(function (o, idx) {
      var d = document.createElement('div');
      d.className = 'opt' + (o.v === estado.loc ? ' sel' : '') + (idx === ativo ? ' ativo' : '');
      d.setAttribute('role', 'option');
      var i = termo ? o.k.indexOf(termo) : -1, s = document.createElement('span');
      if (i >= 0) {
        s.appendChild(document.createTextNode(o.v.slice(0, i)));
        var m = document.createElement('mark'); m.textContent = o.v.slice(i, i + termo.length); s.appendChild(m);
        s.appendChild(document.createTextNode(o.v.slice(i + termo.length)));
      } else s.textContent = o.v;
      d.appendChild(s);
      d.addEventListener('mousedown', function (ev) { ev.preventDefault(); });  // não perde o foco
      d.addEventListener('click', function () { escolher(o.v); });
      frag.appendChild(d);
    });
    box.appendChild(frag);
    if (filtrados.length > LIM) {
      var inf = document.createElement('div'); inf.className = 'info';
      inf.textContent = 'Mostrando ' + LIM + ' de ' + filtrados.length + ' — digite para filtrar.';
      box.appendChild(inf);
    }
    if (!filtrados.length && termo) {
      var n = document.createElement('div'); n.className = 'opt novo';
      n.textContent = 'Endereço não cadastrado. Usar "' + limpa(digitado) + '" mesmo assim';
      n.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
      n.addEventListener('click', function () { escolher(limpa(digitado)); });
      box.appendChild(n);
    }
  }
  function escolher(v) {
    estado.loc = v; gravar('inv_loc', v);
    $('loc').value = v;
    fecharLista();
    $('cod').focus();
    if ($('cod').value.trim()) { ultimoBuscado = ''; buscar(); }
  }
  function marcarAtivo() {
    var itens = $('opts').querySelectorAll('.opt');
    itens.forEach(function (el, i) { el.classList.toggle('ativo', i === ativo); });
    if (itens[ativo]) itens[ativo].scrollIntoView({ block: 'nearest' });
  }

  $('loc').addEventListener('focus', function () { this.select(); abrirLista(); });
  $('loc').addEventListener('click', function () { if (!$('opts').classList.contains('on')) abrirLista(); });
  $('loc').addEventListener('input', function () { ativo = 0; listar(); $('opts').classList.add('on'); });
  $('loc').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var exato = END_IDX.filter(function (o) { return o.k === semAcento($('loc').value); })[0];
      if (exato) escolher(exato.v);
      else if (filtrados.length) escolher(filtrados[Math.min(ativo, filtrados.length - 1)].v);
      else if (limpa($('loc').value)) escolher(limpa($('loc').value));
    } else if (e.key === 'Escape') { $('loc').value = estado.loc; fecharLista(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var max = Math.min(filtrados.length, LIM) - 1;
      ativo = Math.max(0, Math.min(max, ativo + (e.key === 'ArrowDown' ? 1 : -1)));
      marcarAtivo();
    }
  });
  // Saiu do campo sem escolher: volta para o último endereço escolhido
  $('loc').addEventListener('blur', function () {
    setTimeout(function () { fecharLista(); $('loc').value = estado.loc; }, 150);
  });

  // ---- código: bipar (Enter do leitor) ou digitar ----
  $('cod').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); buscar(); $('qtd').focus(); }
  });
  $('cod').addEventListener('blur', buscar);
  var ultimoBuscado = '';
  function buscar() {
    var c = $('cod').value.trim();
    var d = $('desc');
    if (!c) { d.textContent = ''; d.className = 'desc'; ultimoBuscado = ''; return; }
    if (c === ultimoBuscado) return;
    ultimoBuscado = c;
    d.textContent = 'Buscando…'; d.className = 'desc';
    google.script.run
      .withSuccessHandler(function (r) {
        if ($('cod').value.trim() !== c) return;
        if (!r.encontrado) { d.textContent = 'Código não encontrado na base. Confira o número.'; d.className = 'desc warn'; return; }
        if (r.produto !== c.toUpperCase()) { $('cod').value = r.produto; ultimoBuscado = r.produto; }
        d.textContent = r.descricao + (r.enderecoNoSistema === false ? ' · sem saldo neste endereço no sistema' : '');
        d.className = 'desc ' + (r.enderecoNoSistema === false ? 'warn' : 'ok');
      })
      .withFailureHandler(function () { d.textContent = ''; })
      .buscarProduto(c, estado.loc);
  }

  // Abre já no campo certo
  if (!estado.resp) $('resp').focus(); else if (!estado.loc) $('loc').focus(); else $('cod').focus();

  // ---- lançar ----
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    salvarResp();
    if (!estado.resp) { mostrar('err', 'Informe o conferente.'); $('resp').focus(); return; }
    if (!estado.loc) { mostrar('err', 'Escolha o endereço.'); $('loc').focus(); return; }
    var cod = $('cod').value.trim(), qtd = $('qtd').value.trim();
    if (!cod) { mostrar('err', 'Bipe ou digite o código do material.'); $('cod').focus(); return; }
    if (!/^\d+([.,]\d+)?$/.test(qtd)) { mostrar('err', 'Informe a quantidade encontrada.'); $('qtd').focus(); return; }

    var dados = { responsavel: estado.resp, locacao: estado.loc, codigo: cod, quantidade: qtd, segunda: $('seg').checked };
    $('btn').disabled = true; $('btnTx').textContent = 'Salvando…';
    google.script.run
      .withSuccessHandler(function (r) {
        atualizarLista();
        mostrar(r.cadastrado ? 'ok' : 'warn',
          '✔ ' + r.produto + ' · ' + qtd + ' un. em ' + dados.locacao + (r.cadastrado ? '' : ' — código fora da base, avise o responsável.'));
        $('cod').value = ''; $('qtd').value = ''; $('desc').textContent = ''; ultimoBuscado = '';
        $('cod').focus();
        pronto();
      })
      .withFailureHandler(function (err) {
        mostrar('err', 'Não salvou: ' + (err && err.message ? err.message : err) + ' Tente de novo.');
        pronto();
      })
      .salvarContagem(dados);
  });

  function pronto() { $('btn').disabled = false; pintarSeg(); }
  function mostrar(tipo, texto) { var m = $('msg'); m.className = 'msg ' + tipo; m.textContent = texto; }

  // ---- lista ao vivo (todos os conferentes) + base atualizada sozinha ----
  function atualizarLista() {
    google.script.run
      .withSuccessHandler(function (r) {
        $('dot').className = 'dot';
        $('upd').textContent = 'Atualizado às ' + r.agora;
        $('nHist').textContent = r.total ? '· ' + r.total : '';
        desenharLista(r.itens || []);
        if (String(r.baseT) !== String(BASE_T)) recarregarEnderecos();
      })
      .withFailureHandler(function () { $('dot').className = 'dot off'; $('upd').textContent = 'Sem conexão — tentando de novo'; })
      .ultimosLancamentos(15);
  }
  function recarregarEnderecos() {
    google.script.run.withSuccessHandler(function (r) {
      BASE_T = String(r.baseT);
      ENDERECOS = r.enderecos || ENDERECOS;
      END_IDX = ENDERECOS.map(function (e) { return { v: e, k: semAcento(e) }; });
      if ($('opts').classList.contains('on')) listar();
      montarKfl();
    }).listarEnderecos();
  }
  function desenharLista(itens) {
    var ul = $('hist');
    ul.innerHTML = '';
    if (!itens.length) { ul.innerHTML = '<li class="vazio">Nenhum lançamento ainda.</li>'; return; }
    itens.forEach(function (x) {
      var li = document.createElement('li');
      var e2 = /2/.test(String(x.status));
      if (/ANULAD|CANCEL/i.test(x.status)) li.className = 'anulada';
      else if (e2) li.className = 'seg';
      else if (estado.resp && String(x.conf).toUpperCase() === estado.resp) li.className = 'meu';
      li.innerHTML = '<div class="q"></div><div class="t"><b></b><span></span></div><div class="h"><span></span><i></i></div>';
      li.querySelector('.q').textContent = x.qtd;
      li.querySelector('b').textContent = x.sku;
      if (e2) { var t = document.createElement('span'); t.className = 'tag2'; t.textContent = '2ª'; li.querySelector('b').appendChild(t); }
      li.querySelector('.t > span').textContent = x.end + ' · ' + (x.desc || '');
      li.querySelector('.h span').textContent = String(x.hora).slice(0, 5);
      li.querySelector('.h i').textContent = x.conf;
      ul.appendChild(li);
    });
  }
  // ---- KARDEX: ficha FO.SC.A.026 filtrada por endereço (Inventariados ou SBF) ----
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var kFonte = 'inv';
  function montarKardex(k) {
    var cols = [143, 335, 106, 67, 55, 55, 55, 56, 55];
    var POR = 28, pags = Math.max(1, Math.ceil(k.itens.length / POR)), h = '';
    for (var p = 0; p < pags; p++) {
      h += '<div class="kpg"><div class="ktit">' + esc(k.titulo) + '</div><div class="kwrap"><table class="kx"><colgroup>' +
           cols.map(function (w) { return '<col style="width:' + w + 'px">'; }).join('') + '</colgroup>';
      h += '<tr class="r1"><td class="klogo"><img alt="BYD" src="data:image/png;base64,' + k.logo + '"></td><td>KARDEX - MP / MERCADORIA</td><td>ALMOXARIFE</td>' +
           '<td colspan="2">' + esc(k.almoxarife) + '</td><td>FILIAL</td><td colspan="3">PÓS VENDAS</td></tr>';
      h += '<tr class="r2"><th>CÓDIGO SAP</th><th>DESCRICÃO</th><th>LOCAL</th><th colspan="6">QUANT.</th></tr>';
      for (var i = 0; i < POR; i++) {
        var it = k.itens[p * POR + i] || { sku: '', desc: '', local: '', qtd: '' };
        h += '<tr class="b' + (i === POR - 1 ? ' ult' : '') + '"><td>' + esc(it.sku) + '</td><td class="l">' + esc(it.desc) + '</td><td>' + esc(it.local) + '</td>' +
             '<td class="q q1">' + esc(it.qtd) + '</td><td class="q"></td><td class="q"></td><td class="q"></td><td class="q"></td><td class="q q6"></td></tr>';
      }
      h += '</table><div class="kfo"><b>FO.SC.A.026</b>Rev.00 - Set/25</div></div></div>';
    }
    $('kardex').innerHTML = h;
  }
  function montarKfl() {
    var dl = $('kfl');
    dl.innerHTML = '';
    var pref = {};
    (ENDERECOS || []).forEach(function (e) {
      var s = String(e && e.end != null ? e.end : e);
      var ps = s.split(' ');
      for (var n = 1; n <= ps.length; n++) pref[ps.slice(0, n).join(' ')] = true;
    });
    Object.keys(pref).sort().forEach(function (v) { var o = document.createElement('option'); o.value = v; dl.appendChild(o); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.kseg button'), function (bt) {
    bt.addEventListener('click', function () {
      kFonte = bt.getAttribute('data-f');
      Array.prototype.forEach.call(document.querySelectorAll('.kseg button'), function (x) { x.classList.toggle('on', x === bt); });
      if (kFonte === 'sbf') { $('kseg2').checked = false; $('ksw').classList.remove('on'); }
    });
  });
  $('kseg2').addEventListener('change', function () {
    var on = $('kseg2').checked;
    $('ksw').classList.toggle('on', on);
    if (on && kFonte === 'sbf') document.querySelector('.kseg button[data-f="inv"]').click();
    $('kseg2').checked = on; $('ksw').classList.toggle('on', on);
  });
  // ---- Visualização ao vivo + impressão ----
  var kAtual = null, kPedido = 0, kTimer = null;
  function kParams() {
    return { filtro: $('kf').value.trim(), fonte: (kFonte === 'inv' && $('kseg2').checked) ? 'inv2' : kFonte };
  }
  function ajustarZoom() {
    var w = $('kprev').clientWidth;
    $('kardex').style.zoom = w && w < 1123 ? (w / 1123).toFixed(3) : 1;
  }
  function kMsg(t, erro) { $('kmsg').textContent = t || ''; $('kmsg').className = 'kmsg' + (erro ? ' err' : ''); }
  function visualizar(depois) {
    var p = kParams();
    if (!p.filtro) { kAtual = null; $('kardex').innerHTML = '<div class="kvazio">Digite um endereço (ex.: <b>T02 R33 B</b>) para ver o Kardex como ele sai na impressão.</div>'; kMsg(''); return; }
    var n = ++kPedido;
    kMsg('Carregando ' + p.filtro.toUpperCase() + '…');
    google.script.run
      .withSuccessHandler(function (k) {
        if (n !== kPedido) return;
        kAtual = { chave: p.filtro.toUpperCase() + '|' + p.fonte, k: k };
        var nome = k.fonte === 'sbf' ? 'no SBF' : k.fonte === 'inv2' ? 'com 2ª contagem' : 'inventariados';
        montarKardex(k);
        ajustarZoom();
        kMsg(k.itens.length ? k.itens.length + ' ite' + (k.itens.length > 1 ? 'ns ' : 'm ') + nome + ' · ' + Math.max(1, Math.ceil(k.itens.length / 28)) + ' folha(s)' : 'Nenhum item ' + nome + ' em ' + k.titulo + '.');
        if (depois) depois(k);
      })
      .withFailureHandler(function (e) { if (n === kPedido) kMsg('Não gerou o Kardex: ' + (e && e.message ? e.message : e), true); })
      .kardex(p.filtro, p.fonte);
  }
  function agendar() { clearTimeout(kTimer); kTimer = setTimeout(function () { visualizar(); }, 600); }
  $('kf').addEventListener('input', agendar);
  $('kf').addEventListener('keydown', function (e) { if (e.key === 'Enter') { clearTimeout(kTimer); visualizar(); } });
  Array.prototype.forEach.call(document.querySelectorAll('.kseg button'), function (bt) { bt.addEventListener('click', function () { visualizar(); }); });
  $('kseg2').addEventListener('change', function () { visualizar(); });
  window.addEventListener('resize', ajustarZoom);
  function imprimirAgora() {
    var img = $('kardex').querySelector('img');
    var go = function () { setTimeout(function () { window.print(); }, 150); };
    if (img && !img.complete) img.onload = go; else go();
  }
  $('kgo').addEventListener('click', function () {
    var p = kParams();
    if (!p.filtro) { kMsg('Digite o endereço do Kardex (ex.: T02 R33 B).', true); $('kf').focus(); return; }
    if (kAtual && kAtual.chave === p.filtro.toUpperCase() + '|' + p.fonte) { if (kAtual.k.itens.length) imprimirAgora(); return; }
    var b = $('kgo'); b.disabled = true;
    visualizar(function (k) { b.disabled = false; if (k.itens.length) imprimirAgora(); });
    setTimeout(function () { b.disabled = false; }, 15000);
  });
  // ---- Menu lateral ----
  function abrir(v) {
    document.body.classList.toggle('v-k', v === 'k');
    Array.prototype.forEach.call(document.querySelectorAll('.side button'), function (x) { x.classList.toggle('on', x.getAttribute('data-v') === v); });
    try { localStorage.setItem('inv_aba', v); } catch (e) {}
    if (v === 'k') { if (!$('kf').value && estado.loc) { $('kf').value = estado.loc; visualizar(); } ajustarZoom(); }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.side button'), function (x) { x.addEventListener('click', function () { abrir(x.getAttribute('data-v')); }); });
  try { if (localStorage.getItem('inv_aba') === 'k') abrir('k'); } catch (e) {}

  pintarSeg();
  recarregarEnderecos();
  atualizarLista();
  setInterval(function () { if (!document.hidden) atualizarLista(); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) atualizarLista(); });
</script>
</body>
</html>
